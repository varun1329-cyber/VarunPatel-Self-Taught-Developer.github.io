<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Varun Patel — a solo, self-taught coding learner building iOS apps with Xcode and AI-assisted tools."
  >

  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light">

  <title>Varun Patel | Independent Developer</title>

  <style>
    /* ==============================
       Theme
       ============================== */

    :root {
      --background: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --secondary: #626267;
      --border: #dedee3;
      --blue: #0066cc;
      --content-width: 1120px;
      --radius: 28px;
    }

    /* ==============================
       Base
       ============================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-wrap: anywhere;
    }

    ::selection {
      background: #d5e8ff;
      color: var(--text);
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    a:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 6px;
      border-radius: 4px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(
        var(--content-width),
        calc(100% - clamp(32px, 6vw, 80px))
      );
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      z-index: 100;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--text);
      color: var(--surface);
    }

    .skip-link:focus {
      top: 12px;
    }

    /* ==============================
       Header
       ============================== */

    .site-header {
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-inner {
      display: flex;
      align-items: center;
      min-height: 92px;
      padding-block: 18px;
    }

    .header-identity {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 0;
    }

    .site-name {
      color: var(--text);
      font-size: 1.16rem;
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.35;
    }

    .header-caption {
      color: var(--secondary);
      font-size: 0.78rem;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    /* ==============================
       Introduction
       ============================== */

    .hero {
      display: grid;
      grid-template-columns:
        minmax(0, 1.2fr)
        minmax(0, 0.85fr);
      align-items: center;
      gap: clamp(32px, 5vw, 72px);
      padding-block: clamp(44px, 7vw, 88px);
    }

    .hero-copy {
      min-width: 0;
    }

    h1 {
      font-size: clamp(3rem, 6.1vw, 5.1rem);
      font-weight: 650;
      line-height: 1.06;
      letter-spacing: -0.065em;
    }

    .intro-line {
      display: block;
    }

    .hero-tagline {
      margin-top: 24px;
      color: var(--text);
      font-size: clamp(1.25rem, 2.2vw, 1.75rem);
      font-weight: 550;
      line-height: 1.3;
      letter-spacing: -0.035em;
    }

    .hero-description {
      max-width: 540px;
      margin-top: 20px;
      color: var(--secondary);
      font-size: clamp(1rem, 1.4vw, 1.1rem);
      line-height: 1.8;
      letter-spacing: -0.015em;
    }

    /* Visible email: plain text, not a link. */

    .contact-email {
      display: block;
      max-width: 100%;
      margin-top: 22px;
      color: var(--secondary);
      font-size: 0.95rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
      user-select: text;
    }

    /*
      Future email-link styling.
      The matching HTML link is commented out below.
    */

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-height: 44px;
      margin-top: 22px;
      font-size: 0.95rem;
    }
